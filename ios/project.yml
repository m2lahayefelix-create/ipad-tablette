name: Tablette
options:
  bundleIdPrefix: com.gdelahaye
  deploymentTarget:
    iOS: "15.0"
targets:
  Tablette:
    type: application
    platform: iOS
    sources: [Tablette]
    info:
      path: Tablette/Info.plist
      properties:
        CFBundleDisplayName: Tablette
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        NSLocalNetworkUsageDescription: "Recevoir l'ecran du PC par le cable USB."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gdelahaye.tablette
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
